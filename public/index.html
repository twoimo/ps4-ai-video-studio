<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e14" />
    <title>쇼츠</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="library" id="shorts">
      <header class="library-bar">
        <h1>쇼츠</h1>
        <details class="library-more" id="library-more">
          <summary>더보기</summary>
          <div class="library-menu">
            <button type="button" id="import-library">이미 만든 편 가져오기</button>
            <button type="button" id="open-template">프롬프트 템플릿</button>
            <button type="button" id="refresh-all">새로고침</button>
          </div>
        </details>
      </header>
      <div class="shorts-grid" id="shorts-grid" aria-live="polite" aria-label="쇼츠">
        <button type="button" class="short-card short-create-tile" id="create-tile">
          <div class="short-card-thumb create-thumb"><span class="create-plus">+</span></div>
          <div class="short-card-body"><h3>새 쇼츠</h3></div>
        </button>
      </div>
    </main>

    <div class="studio-overlay" id="create-overlay" hidden>
      <div class="overlay-backdrop" data-close-view="grid"></div>
      <div class="overlay-panel create-overlay-panel" role="dialog" aria-modal="true" aria-labelledby="create-title">
        <div class="overlay-chrome"><button type="button" class="ghost-button overlay-back" id="close-create">← 라이브러리</button></div>
        <form class="create-panel" id="create-form">
          <h2 id="create-title">새 쇼츠</h2>
          <label class="field-label" for="topic">주제</label>
          <input id="topic" name="topic" placeholder="예: 오래된 도시 시설의 숨은 원리" required minlength="4" />
          <div id="facts-field">
            <label class="field-label" for="facts">출처에 적힌 사실 <span class="muted">(줄바꿈으로 구분 · 없는 숫자는 만들지 않음)</span></label>
            <textarea id="facts" rows="4" placeholder="출처에서 확인한 사실만 적습니다.&#10;예: 지붕 면적 2만 m²"></textarea>
          </div>
          <button class="primary-button" type="submit"><span>시작</span></button>
          <details class="advanced-create" id="advanced-create">
            <summary>고급</summary>
            <p class="form-footnote">월드 슬롯, 다른 생성 소스, 로컬 업로드는 여기에만 있습니다. 공장은 공식 grok CLI만 쓰며 Gemini로 대체하지 않습니다.</p>
            <label class="field-label" for="sources">검증 출처 URL</label>
            <textarea id="sources" rows="2" placeholder="주제에 맞는 공식 출처 URL"></textarea>
            <div id="create-world-slots" class="slot-grid"></div>
            <div id="create-prompt-preview" class="prompt-preview" aria-live="polite"></div>
            <div class="form-row">
              <div>
                <label class="field-label" for="format">영상 비율</label>
                <select id="format">
                  <option value="vertical" selected>9:16 · 쇼츠</option>
                  <option value="landscape">16:9</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="clip-count">클립 수</label>
                <select id="clip-count">
                  <option>4</option>
                  <option>6</option>
                  <option selected>7</option>
                  <option>8</option>
                  <option>10</option>
                </select>
              </div>
            </div>
            <label class="field-label" for="provider">생성 소스</label>
            <select id="provider" aria-describedby="provider-help">
              <option value="grok-imagine" selected>Grok Imagine 공장</option>
              <option value="gemini-browser">Gemini · Chrome</option>
              <option value="local-video">로컬 영상 모델</option>
              <option value="local">로컬 클립 업로드</option>
            </select>
            <p id="provider-help" class="form-footnote">Grok Imagine 공장은 PATH의 grok 또는 ~/.grok/bin/grok와 이미 되어 있는 SuperGrok OAuth만 사용합니다. XAI_API_KEY와 grok login/logout은 쓰지 않으며 Gemini로 대체하지 않습니다.</p>
            <button class="ghost-button" id="browser-start" type="button">Gemini Chrome 연결</button>
            <div class="toggle-row">
              <label class="toggle-label"><input id="captions" type="checkbox" checked /><span class="toggle"></span><span>한국어 자막 <b class="toggle-state" data-toggle-state="captions">켜짐</b></span></label>
              <label class="toggle-label"><input id="voiceover" type="checkbox" /><span class="toggle"></span><span>macOS 음성 <b class="toggle-state" data-toggle-state="voiceover">꺼짐</b></span></label>
            </div>
          </details>
        </form>
      </div>
    </div>

    <div class="studio-overlay" id="template-overlay" hidden>
      <div class="overlay-backdrop" data-close-view="grid"></div>
      <div class="overlay-panel template-overlay-panel" role="dialog" aria-modal="true" aria-labelledby="template-title">
        <div class="overlay-chrome"><button type="button" class="ghost-button overlay-back" id="close-template">← 라이브러리</button></div>
        <div id="template-root" class="template-root"><p id="template-title">잠긴 프롬프트를 불러오는 중</p></div>
      </div>
    </div>

    <div class="studio-overlay" id="short-overlay" hidden>
      <div class="overlay-backdrop" data-close-view="grid"></div>
      <div class="overlay-panel short-detail-panel" role="dialog" aria-modal="true" aria-labelledby="short-detail-title">
        <div class="overlay-chrome"><button type="button" class="ghost-button overlay-back" id="close-short">← 라이브러리</button></div>
        <div class="short-detail-layout">
          <section class="job-detail" id="job-detail" aria-live="polite">
            <p id="short-detail-title">쇼츠를 선택하면 화면이 열립니다.</p>
          </section>
          <section class="live-factory" id="live-factory" aria-live="polite" hidden></section>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
